<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本机投递看板</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #e6e8ee;
    --dim: #9aa3b2; --accent: #6ea8fe; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#fff; --line:#e3e6ec; --fg:#1b1f27; --dim:#5b6472; --accent:#2563eb; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding:22px 28px 6px; }
  h1 { margin:0 0 4px; font-size:20px; letter-spacing:.2px; }
  .sub { color:var(--dim); font-size:13px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
           gap:12px; padding:16px 28px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .card span { color:var(--dim); font-size:12px; }
  nav { display:flex; gap:4px; padding:0 28px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:none; border:0; color:var(--dim); padding:10px 14px; cursor:pointer;
               font-size:14px; border-bottom:2px solid transparent; }
  nav button.on { color:var(--fg); border-bottom-color:var(--accent); }
  main { padding:18px 28px 60px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  input, select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
                  border-radius:8px; padding:7px 10px; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; font-size:12px; letter-spacing:.3px; }
  tr:hover td { background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px;
         border:1px solid var(--line); color:var(--dim); }
  .tag.active { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .tag.failed { color:var(--bad); border-color:color-mix(in srgb, var(--bad) 45%, transparent); }
  .tag.offer  { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, transparent); }
  .muted { color:var(--dim); }
  .err { color:var(--bad); padding:10px 0; }
  a { color:var(--accent); }
  @media (max-width:640px){ header,.cards,nav,main{ padding-left:14px; padding-right:14px; } }
</style>
</head>
<body>
<header>
  <h1>本机投递看板</h1>
  <div class="sub" id="sub">连接中…</div>
</header>

<div class="cards" id="cards"></div>

<nav role="tablist" aria-label="看板视图">
  <button role="tab" data-tab="overview" aria-selected="true" class="on">概览</button>
  <button role="tab" data-tab="apps" aria-selected="false">投递记录</button>
  <button role="tab" data-tab="unapplied" aria-selected="false">未投递</button>
  <button role="tab" data-tab="exams" aria-selected="false">考试</button>
  <button role="tab" data-tab="notices" aria-selected="false">提醒</button>
</nav>

<main id="main" role="tabpanel" aria-live="polite"><div class="muted">加载中…</div></main>

<script>
var API = "/api/agent";
var state = { tab: "overview" };

function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
  return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function get(url) { return fetch(url).then(function (r) { return r.json(); }); }

function badge(cat) {
  var map = { active: "进行中", failed: "已挂", offer: "Offer", applied: "已投递", other: "其它" };
  return '<span class="tag ' + esc(cat) + '">' + esc(map[cat] || cat) + "</span>";
}

function renderCards(st) {
  var items = [
    ["投递记录", st.n_app], ["覆盖公司", st.n_company], ["岗位库", st.n_pos],
    ["未投递", st.n_unapplied], ["进行中", st.active], ["已挂", st.failed], ["Offer", st.offer]
  ];
  document.getElementById("cards").innerHTML = items.map(function (it) {
    return '<div class="card"><b>' + esc(it[1]) + "</b><span>" + esc(it[0]) + "</span></div>";
  }).join("");
}

function renderOverview(d) {
  renderCards(d.stats);
  var rows = (d.recent || []).map(function (r) {
    return "<tr><td>" + esc(r.date) + "</td><td>" + esc(r.company) + "</td><td>" +
      esc(r.position) + "</td><td>" + badge(r.status_category) + " " + esc(r.status) + "</td></tr>";
  }).join("");
  document.getElementById("main").innerHTML =
    '<table><thead><tr><th>日期</th><th>公司</th><th>岗位</th><th>状态</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="4" class="muted">暂无记录</td></tr>') + "</tbody></table>";
  document.getElementById("sub").textContent =
    "本机服务 · 生成于 " + (d.generated_at || "") + " · 数据存于 data/board.db";
}

function renderApps() {
  var q = document.getElementById("q") ? document.getElementById("q").value : "";
  get(API + "/applications?limit=200&company=" + encodeURIComponent(q)).then(function (d) {
    var rows = d.items.map(function (r) {
      return "<tr><td>" + esc(r.date) + "</td><td>" + esc(r.company) + "</td><td>" +
        esc(r.position) + "</td><td>" + badge(r.status_category) + " " + esc(r.status) +
        "</td><td>" + esc(r.n) + "</td></tr>";
    }).join("");
    document.getElementById("main").innerHTML =
      '<div class="bar"><input id="q" placeholder="按公司筛选" value="' + esc(q) + '">' +
      '<span class="muted">共 ' + d.total + " 条</span></div>" +
      '<table><thead><tr><th>日期</th><th>公司</th><th>岗位</th><th>状态</th><th>岗数</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="5" class="muted">没有匹配</td></tr>') + "</tbody></table>";
    var box = document.getElementById("q");
    box.addEventListener("keydown", function (e) { if (e.key === "Enter") renderApps(); });
  });
}

function renderUnapplied() {
  get(API + "/unapplied?limit=200").then(function (d) {
    var rows = d.items.map(function (r) {
      return "<tr><td>" + esc(r.company) + "</td><td>" + esc(r.industry) + "</td><td>" +
        esc(r.direction) + "</td><td>" + esc(r.source) + "</td></tr>";
    }).join("");
    document.getElementById("main").innerHTML =
      '<div class="bar"><span class="muted">共 ' + d.total + " 条（已排除已投公司）</span></div>" +
      '<table><thead><tr><th>公司</th><th>行业</th><th>方向</th><th>来源</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="4" class="muted">暂无</td></tr>') + "</tbody></table>";
  });
}

function renderExams() {
  get(API + "/exams").then(function (d) {
    var rows = d.items.map(function (r) {
      return "<tr><td>" + esc(r.when) + "</td><td>" + esc(r.company) + "</td><td>" +
        esc(r.kind) + "</td><td>" + esc(r.place) + "</td><td>" + esc(r.note) + "</td></tr>";
    }).join("");
    document.getElementById("main").innerHTML =
      '<table><thead><tr><th>时间</th><th>公司</th><th>类型</th><th>地点</th><th>备注</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="5" class="muted">暂无安排</td></tr>') + "</tbody></table>";
  });
}

function renderNotices() {
  get(API + "/notices?limit=50").then(function (d) {
    var rows = d.items.map(function (r) {
      return "<tr><td>" + esc(r.at) + "</td><td>" + esc(r.company) + "</td><td>" + esc(r.text) + "</td></tr>";
    }).join("");
    document.getElementById("main").innerHTML =
      '<div class="bar"><span class="muted">未读 ' + d.unread + " 条</span></div>" +
      '<table><thead><tr><th>时间</th><th>公司</th><th>内容</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="3" class="muted">暂无提醒</td></tr>') + "</tbody></table>";
  });
}

function show(tab) {
  state.tab = tab;
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
    var on = b.dataset.tab === tab;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  if (tab === "overview") get(API + "/overview").then(renderOverview);
  if (tab === "apps") renderApps();
  if (tab === "unapplied") renderUnapplied();
  if (tab === "exams") renderExams();
  if (tab === "notices") renderNotices();
}

Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
  b.addEventListener("click", function () { show(b.dataset.tab); });
});
show("overview");
</script>
</body>
</html>
